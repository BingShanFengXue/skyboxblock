# skyboxblock —— Minecraft 26.2 / Fabric 移植线
# 构建前置：JDK 25（设 JAVA_HOME）、GRADLE_USER_HOME 建议指向本项目 .gradle-home
# 与仓库根目录的 1.21.1 主线互不影响，两者可并存构建。
# ─────────────────────────────────────────────────────────────────────────────

org.gradle.jvmargs=-Xmx4G -XX:+UseParallelGC
org.gradle.parallel=true
org.gradle.caching=true
# 26.2 最低 Java 25。Gradle 会用 JAVA_HOME 找到的 JDK；若本机有多个 JDK，
# 可在 ~/.gradle/gradle.properties 里自行设置 org.gradle.java.installations.paths，
# 该机器相关设置不进仓库。

# Fabric 组件版本（来源：fabric-example-mod 26.2 分支 + maven.fabricmc.net maven-metadata）
minecraft_version=26.2
loader_version=0.20.1
loom_version=1.19.3
fabric_api_version=0.161.0+26.2

mod_version=1.0.6-test.1-port.2
maven_group=dev.yg.skyboxblock
archives_base_name=skyboxblock
